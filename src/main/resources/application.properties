spring.application.name=auth-service

spring.datasource.url=jdbc:postgresql://localhost:5432/psec
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-init-sql=SET search_path TO sec,public

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=sec

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:xyz7@gmail.com}
spring.mail.password=${SMTP_PASSWORD:dcnw cjem wved rmsv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=8081

management.endpoints.web.exposure.include=all

logging.level.com.pranav.auth=INFO

# ============================================================================
# auth-service specific configuration
# ============================================================================

auth.issuer=gas-auth-service

auth.jwt.private-key-secret-name=${JWT_PRIVATE_KEY_SECRET_NAME:gas/auth/rsa-private-key}
auth.jwt.secret-json-field=${JWT_SECRET_JSON_FIELD:JWT_PRIVATE_KEY}
auth.jwt.aws-region=${AWS_REGION:us-east-1}
auth.jwt.access-token-ttl=1m
auth.jwt.refresh-token-ttl=7d
auth.jwt.private-key-cache-ttl=1h

# Cookie and CORS settings. Set auth.cookie.secure=true when serving over HTTPS.
auth.cookie.allowed-origin=http://localhost:8081
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=Strict
auth.cookie.path=/api/v1/auth

auth.lockout.max-failed-attempts=5
auth.lockout.lockout-duration-minutes=30

auth.email.enabled=${EMAIL_ENABLED:true}
auth.email.from-address=abc7@gmail.com
auth.email.verification-base-url=http://localhost:8081/api/v1/auth/verify-email
auth.email.verification-token-ttl=1m
